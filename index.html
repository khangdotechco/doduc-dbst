<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Độ đục nước — ĐBST</title>
<meta name="theme-color" content="#1F3864">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --navy: #1F3864;
    --navy2: #2A4A85;
    --bg: #eef2f8;
    --ok: #2E8B57;
    --err: #C0392B;
    --warn: #B8860B;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: #222; min-height: 100vh;
  }
  header {
    background: var(--navy); color: #fff; padding: 14px 16px;
    font-size: 17px; font-weight: 700; letter-spacing: .3px;
  }
  header small { display:block; font-weight:400; font-size:12px; opacity:.85; margin-top:2px; }
  main { padding: 14px; max-width: 520px; margin: 0 auto; }
  .card {
    background: #fff; border-radius: 12px; padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 12px;
  }
  label { display:block; font-size:13px; font-weight:600; color:#374151; margin: 12px 0 4px; }
  label .req { color: var(--err); }
  select, input[type=date], input[type=time], input[type=text], input[type=number] {
    width:100%; font-size:16px; padding:10px 12px; border:1px solid #cbd5e1;
    border-radius:8px; background:#fff; color:#111;
  }
  select:focus, input:focus { outline:2px solid var(--navy2); border-color:var(--navy2); }
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  input[type=file] { width:100%; font-size:14px; }
  .hint { font-size:12px; color:#6b7280; margin-top:3px; }
  button {
    width:100%; margin-top:16px; padding:14px; font-size:17px; font-weight:700;
    color:#fff; background:var(--navy); border:none; border-radius:10px; cursor:pointer;
  }
  button:disabled { background:#9aa5b1; cursor:not-allowed; }
  #status { margin-top:12px; padding:12px; border-radius:8px; font-size:14px; white-space:pre-wrap; display:none; }
  #status.ok { display:block; background:#e6f4ec; color:var(--ok); }
  #status.err { display:block; background:#fdecea; color:var(--err); }
  #status.info { display:block; background:#eef2f8; color:#374151; }
  .field { margin-top:12px; }
  .sectionTitle { margin-top:16px; font-size:14px; font-weight:700; color:var(--navy); }
  .basinRow { border-top:1px dashed #d7dee8; padding:10px 0 4px; margin-top:8px; }
  .basinRow label { margin:0 0 4px; }
  .basinRow input[type=text] { margin-bottom:6px; }
  .photoHint { display:block; font-size:12px; color:#6b7280; margin-top:4px; }
  .warn { display:block; background:#fff8e1; border:1px solid #f0d060; color:#8a6d00; padding:8px 10px; border-radius:8px; font-size:13px; margin-top:8px; white-space:pre-wrap; }
  button.secondary { background:#eef2f8; color:var(--navy); border:1px solid #cbd5e1; }
  table.history { width:100%; border-collapse:collapse; font-size:13px; }
  table.history th, table.history td { border:1px solid #d7dee8; padding:6px 8px; text-align:left; white-space:nowrap; }
  table.history th { background:#eef2f8; color:#374151; }
</style>
</head>
<body>
<header>
  ĐỘ ĐỤC NƯỚC — ĐÔNG BẮC SÔNG TIỀN
  <small>Nhập kết quả đo · gửi về trung tâm</small>
</header>
<main>
  <!-- ============ CẤU HÌNH (anh Khang điền sau khi deploy Apps Script) ============ -->
  <script>
    // KHONG de token bot trong trang nay nua (PHA 3b). Trang chi goi Apps Script.
    // Anh Khang deploy apps_script.gs xong thi dan URL /exec va khoa chung vao day:
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbygHddO9ggxQ9HxTMKMeqBB42TTC1HFTt4anD-MN_EBmBzAyiylwkYXIuempxcfMYZCkQ/exec';
    const SHARED_KEY = 'doduc-dbst.2026';
  </script>
  <!-- ========================================================================== -->

  <div class="card">
    <label for="plant">Nhà máy <span class="req">*</span></label>
    <select id="plant">
      <option value="">— Chọn trạm —</option>
      <!-- CHI 9 NHA MAY NUOC MAT. Nuoc ngam (SXD, Phuong Tra, TX-gieng) KHONG do do duc
           (Khang chot 06/09, C5+C23) => bo khoi PWA do duc va bao cao do duc. -->
      <option value="DB">Đông Bình(DB)</option>
      <option value="DW">Dowaco(DW)</option>
      <option value="HCL">Mỹ Thọ(HCL)</option>
      <option value="MA">Mỹ An(MA)</option>
      <option value="MH">Mỹ Hiệp(MH)</option>
      <option value="TL">Tân Long(TL)</option>
      <option value="TN">Tân Nghĩa(TN)</option>
      <option value="TQT">Trần Quốc Toản(TQT)</option>
      <option value="TXmat">Trường Xuân-mặt(TX)</option>
    </select>

    <div class="row2">
      <div>
        <label for="d">Ngày đo <span class="req">*</span></label>
        <input type="date" id="d">
      </div>
      <div>
        <label for="t">Giờ đo <span class="req">*</span></label>
        <input type="time" id="t">
      </div>
    </div>

    <div class="field">
      <label for="tho">Độ đục thô (NTU) <span class="req">*</span></label>
      <input type="text" id="tho" inputmode="decimal" placeholder="0.0">
    </div>
    <div class="field">
      <label for="photoTho">Ảnh độ đục thô <span class="req">*</span></label>
      <input type="file" id="photoTho" accept="image/*">
    </div>

    <div id="langBlock" style="display:none;">
      <div class="sectionTitle">Độ đục sau lắng (NTU)</div>
      <div class="hint">Có thể nhập thiếu bể (C20). Ảnh bắt buộc cho bể có số CAO NHẤT trong các bể đã nhập.</div>
      <div id="langFields"></div>
    </div>

    <div class="field">
      <label for="mang">Độ đục ra mạng (NTU) <span class="req">*</span></label>
      <input type="text" id="mang" inputmode="decimal" placeholder="0.0">
    </div>
    <div class="field">
      <label for="photoMang">Ảnh độ đục ra mạng <span class="req">*</span></label>
      <input type="file" id="photoMang" accept="image/*">
    </div>

    <label for="bySelect">Người đo</label>
    <select id="bySelect">
      <option value="">— Chọn tên —</option>
      <option value="__other__">Khác… (nhập tên)</option>
    </select>
    <input type="text" id="byOther" placeholder="Nhập tên người đo" autocomplete="name"
           style="display:none; margin-top:8px;">

    <button id="send">📤 GỬI</button>
    <div id="status"></div>
  </div>

  <div class="card">
    <button id="historyBtn" class="secondary">🕘 Xem 7 ngày gần đây</button>
    <div id="historySummary" class="hint" style="margin-top:8px;"></div>
    <div id="historyBox" style="display:none; margin-top:8px; overflow-x:auto;"></div>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const plantSel = $('plant'), dInp = $('d'), tInp = $('t');
  const thoInp = $('tho'), mangInp = $('mang');
  const photoThoInp = $('photoTho'), photoMangInp = $('photoMang');
  const langBlock = $('langBlock'), langFields = $('langFields');
  const bySelect = $('bySelect'), byOther = $('byOther'), btn = $('send'), status = $('status');
  const historyBtn = $('historyBtn'), historySummary = $('historySummary'), historyBox = $('historyBox');
  let langInputs = [];   // [{be, numEl, photoEl}] — khai báo sớm để tránh lỗi TDZ

  // Số bể lắng từng trạm — ⚠️ PHẢI KHỚP PLANT_BASINS trong pipeline/water_quality.py (BƯỚC 1).
  const PLANT_BASINS = {
    SXD: 0, PhuongTra: 0, TXgieng: 0,
    DB: 6, DW: 2, HCL: 6, MA: 3, MH: 2, TL: 1, TN: 1, TQT: 1, TXmat: 1
  };
  // Ngưỡng NHÚNG TĨNH — CHỈ để nhắc mềm (C22 lớp 1). Nguồn ngưỡng THẬT = sheet 'dinh muc quy dinh'.
  const THO_NGUONG = 100, LANG_NGUONG_DUOI = 10, LANG_NGUONG_TREN = 15;

  const PLANT_NAMES = {
    SXD: 'SXD(CD)', PhuongTra: 'Phuong Tra(CD)', DB: 'Đông Bình(DB)',
    DW: 'Dowaco(DW)', HCL: 'Mỹ Thọ(HCL)', MA: 'Mỹ An(MA)', MH: 'Mỹ Hiệp(MH)',
    TL: 'Tân Long(TL)', TN: 'Tân Nghĩa(TN)', TQT: 'Trần Quốc Toản(TQT)',
    TXgieng: 'Trường Xuân-giếng(TX)', TXmat: 'Trường Xuân-mặt(TX)'
  };
  const PLANT_STAFF = {
  "SXD": [
    "Nguyễn Lê Sĩ",
    "Phạm Hồng Lĩnh",
    "Đặng Công Khanh"
  ],
  "PhuongTra": [
    "Nguyễn Lê Sĩ",
    "Phạm Hồng Lĩnh",
    "Đặng Công Khanh"
  ],
  "TL": [
    "Nguyễn Lê Sĩ",
    "Phạm Hồng Lĩnh",
    "Đặng Công Khanh"
  ],
  "DB": [
    "Cao Thanh Dững",
    "Nguyễn Thành Nghĩa",
    "Nguyễn Đăng Khoa",
    "Trương Minh Ngọc",
    "Trần Minh Lý"
  ],
  "DW": [
    "Nguyễn Đăng Khoa",
    "Phan Huy Tùng",
    "Trương Minh Ngọc",
    "Trần Minh Lý"
  ],
  "HCL": [
    "Lê Thành Công",
    "Nguyễn Anh Tuấn",
    "Ngô Trọng Ân"
  ],
  "MA": [
    "Lưu Văn Gò",
    "Ngô Võ Phước Tài",
    "Trần Văn Công"
  ],
  "MH": [
    "Phạm Minh Nhựt",
    "Trần Hửu Vinh"
  ],
  "TN": [
    "Hồ Lê Hải Trường",
    "Lê Văn Mười"
  ],
  "TQT": [
    "Nguyễn Hữu Nghĩa",
    "Võ Minh Nhựt",
    "Vũ Đức Cương"
  ],
  "TXgieng": [
    "Nguyễn Thanh Vũ",
    "Võ Hồng Sơn"
  ],
  "TXmat": [
    "Nguyễn Thanh Vũ",
    "Võ Hồng Sơn"
  ]
};

  function nowLocal() {
    const n = new Date();
    const p = x => String(x).padStart(2, '0');
    dInp.value = dInp.value || `${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`;
    tInp.value = tInp.value || `${p(n.getHours())}:${p(n.getMinutes())}`;
  }
  function populateBySelect(code) {
    const names = PLANT_STAFF[code] || [];
    const lastPick = localStorage.getItem('wq_by_' + code) || '';
    bySelect.innerHTML = '';
    const optEmpty = document.createElement('option');
    optEmpty.value = ''; optEmpty.textContent = '— Chọn tên —';
    bySelect.appendChild(optEmpty);
    names.forEach(n => {
      const o = document.createElement('option');
      o.value = n; o.textContent = n;
      bySelect.appendChild(o);
    });
    const optOther = document.createElement('option');
    optOther.value = '__other__'; optOther.textContent = 'Khác… (nhập tên)';
    bySelect.appendChild(optOther);
    bySelect.value = names.includes(lastPick) ? lastPick : '';
    byOther.style.display = 'none';
    byOther.value = localStorage.getItem('wq_by_other_last') || '';
  }
  plantSel.addEventListener('change', () => {
    populateBySelect(plantSel.value);
    buildLangFields(plantSel.value);
  });
  bySelect.addEventListener('change', () => {
    if (bySelect.value === '__other__') {
      byOther.style.display = 'block';
      byOther.focus();
    } else {
      byOther.style.display = 'none';
    }
  });
  populateBySelect(plantSel.value);
  nowLocal();
  buildLangFields(plantSel.value);

  // ---- form sau lắng động theo trạm (BƯỚC 2) ----
  function buildLangFields(code) {
    const n = PLANT_BASINS[code] || 0;
    langInputs = [];
    langFields.innerHTML = '';
    if (n <= 0) { langBlock.style.display = 'none'; return; }
    langBlock.style.display = 'block';
    for (let be = 1; be <= n; be++) {
      const row = document.createElement('div');
      row.className = 'basinRow';
      const lbl = document.createElement('label');
      lbl.textContent = 'Sau lắng — bể ' + be + ' (NTU)';
      const numEl = document.createElement('input');
      numEl.type = 'text'; numEl.inputMode = 'decimal'; numEl.placeholder = '—';
      numEl.dataset.be = String(be);
      const phLbl = document.createElement('label');
      phLbl.className = 'photoHint';
      phLbl.textContent = 'Ảnh bể ' + be;
      const phEl = document.createElement('input');
      phEl.type = 'file'; phEl.accept = 'image/*';
      phEl.dataset.be = String(be);
      row.appendChild(lbl);
      row.appendChild(numEl);
      row.appendChild(phLbl);
      row.appendChild(phEl);
      langFields.appendChild(row);
      langInputs.push({ be: be, numEl: numEl, photoEl: phEl });
    }
  }

  function show(msg, kind) {
    status.className = kind;
    status.textContent = msg;
    status.style.display = 'block';
  }
  function clearStatus() { status.className = ''; status.textContent = ''; status.style.display = 'none'; }

  function num(v) {
    // nhap "3,2" hoac "3.2" deu ra 3.2 (dau phay VN = thap phan)
    if (v === '') return null;
    const n = parseFloat(String(v).replace(',', '.'));
    return Number.isFinite(n) ? n : null;
  }

  function fmtNum(n) {
    // hien thi kieu VN (dau phay thap phan); bot Python doc "3,2" thanh 3.2
    if (n === null) return '';
    return String(n).replace('.', ',');
  }

  // ---- nen anh truoc khi gui (anh may do 2-5MB -> ~200-500KB, van doc duoc so) ----
  function readFileAsDataURL(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }
  function loadImage(src) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => rej(new Error('Không đọc được ảnh.'));
      img.src = src;
    });
  }
  async function compressImage(file) {
    const img = await loadImage(await readFileAsDataURL(file));
    const maxEdge = 1600;
    let w = img.naturalWidth || img.width;
    let h = img.naturalHeight || img.height;
    if (Math.max(w, h) > maxEdge) {
      const k = maxEdge / Math.max(w, h);
      w = Math.round(w * k); h = Math.round(h * k);
    }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.8));
    const base64 = (await readFileAsDataURL(blob)).split(',')[1];   // bo phan data:image/...
    return {
      base64: base64,
      mime: 'image/jpeg',
      name: (file.name || 'anh.jpg').replace(/\.[^.]+$/, '') + '.jpg'
    };
  }

  btn.addEventListener('click', async () => {
    clearStatus();

    if (!APPS_SCRIPT_URL || !SHARED_KEY) {
      show('❌ Trang chưa cấu hình APPS_SCRIPT_URL / SHARED_KEY.\nMở file index.html và điền 2 ô ở đầu.', 'err');
      return;
    }
    const code = plantSel.value;
    if (!code) { show('❌ Vui lòng chọn nhà máy.', 'err'); return; }
    if (!dInp.value || !tInp.value) { show('❌ Vui lòng điền ngày và giờ đo.', 'err'); return; }

    const tho = num(thoInp.value.trim());
    const mang = num(mangInp.value.trim());
    if (tho === null) { show('❌ "Độ đục thô" bắt buộc phải nhập.', 'err'); thoInp.focus(); return; }
    if (mang === null) { show('❌ "Độ đục ra mạng" bắt buộc phải nhập.', 'err'); mangInp.focus(); return; }
    if (tho < 0 || mang < 0) { show('❌ Số đo không được âm.', 'err'); return; }

    // sau lắng: so được để trống (C20); gom các bể đã nhập
    const langVals = [];   // [{be, val}]
    for (const it of langInputs) {
      const v = num(it.numEl.value.trim());
      if (v !== null) {
        if (v < 0) { show('❌ Số đo không được âm.', 'err'); it.numEl.focus(); return; }
        langVals.push({ be: it.be, val: v });
      }
    }

    // kiem tra logic: tho >= lang >= mang — nguoc thi hoi lai
    for (const lv of langVals) {
      if (tho < lv.val && !confirm('⚠️ Độ đục thô nhỏ hơn sau lắng (bể ' + lv.be + ').\nSố có đúng không?')) return;
    }
    for (const lv of langVals) {
      if (lv.val < mang && !confirm('⚠️ Độ đục sau lắng (bể ' + lv.be + ') nhỏ hơn ra mạng.\nSố có đúng không?')) return;
    }

    // ---- Ảnh (C22) ----
    if (photoThoInp.files.length === 0) {
      show('❌ Thiếu ảnh độ đục THÔ (bắt buộc 1 ảnh).', 'err'); return;
    }
    if (photoMangInp.files.length === 0) {
      show('❌ Thiếu ảnh độ đục RA MẠNG (bắt buộc 1 ảnh).', 'err'); return;
    }
    // sau lắng: ảnh BẮT BUỘC cho bể có số CAO NHẤT trong các bể ĐÃ NHẬP (so số, không cần ngưỡng)
    if (langVals.length > 0) {
      const top = Math.max(...langVals.map(x => x.val));
      const topBes = langVals.filter(x => x.val === top).map(x => x.be);
      for (const be of topBes) {
        const it = langInputs.find(x => x.be === be);
        if (it && it.photoEl.files.length === 0) {
          show(`❌ Thiếu ảnh của BỂ ${be} (bể có số cao nhất trong các bể đã nhập: ${fmtNum(top)} NTU).`, 'err');
          return;
        }
      }
    }

    // nhắc mềm: bể vượt ngưỡng nhúng (thô <= 100 -> 10; thô > 100 -> 15) — KHÔNG chặn
    const nguong = tho <= THO_NGUONG ? LANG_NGUONG_DUOI : LANG_NGUONG_TREN;
    const over = langVals.filter(x => x.val > nguong);
    let warnMsg = '';
    if (over.length > 0) {
      warnMsg = '⚠️ LƯU Ý: ' + over.map(x => `bể ${x.be} = ${fmtNum(x.val)} NTU vượt ngưỡng ${nguong} NTU (thô ${fmtNum(tho)}).`).join(' ');
      show(warnMsg, 'warn');
    }

    const by = bySelect.value === '__other__'
      ? byOther.value.trim()
      : (bySelect.value || '');
    if (bySelect.value === '__other__' && !by) {
      show('❌ Vui lòng nhập tên người đo (mục "Khác").', 'err'); byOther.focus(); return;
    }
    // 1 dong may-doc + vai dong nguoi-doc cho dep nhom
    const n = PLANT_BASINS[code] || 0;
    const langSlot = [];
    for (let be = 1; be <= n; be++) {
      const lv = langVals.find(x => x.be === be);
      langSlot.push(lv ? fmtNum(lv.val) : '');
    }
    const machine = ['WQ', code, dInp.value, tInp.value,
                     fmtNum(tho), langSlot.join(';'), fmtNum(mang), by].join('|');
    const langHuman = langVals.length ? langVals.map(x => `bể ${x.be}: ${fmtNum(x.val)}`).join(' · ') : '—';
    const human = [
      `📊 Độ đục ${PLANT_NAMES[code]} ${dInp.value.split('-').reverse().join('.')} ${tInp.value}`,
      `   thô ${fmtNum(tho)} / lắng ${langHuman} / ra mạng ${fmtNum(mang)} NTU` +
      (by ? ` (— ${by})` : '')
    ].join('\n');

    btn.disabled = true;
    if (status.className !== 'warn') show('⏳ Đang nén ảnh và gửi…', 'info');
    try {
      const photos = [];
      const cTho = await compressImage(photoThoInp.files[0]);
      photos.push({ vitri: 'tho', base64: cTho.base64, mime: cTho.mime, name: cTho.name });
      for (const it of langInputs) {
        if (it.photoEl.files.length > 0) {
          const c = await compressImage(it.photoEl.files[0]);
          photos.push({ vitri: 'l' + it.be, base64: c.base64, mime: c.mime, name: c.name });
        }
      }
      const cMang = await compressImage(photoMangInp.files[0]);
      photos.push({ vitri: 'mang', base64: cMang.base64, mime: cMang.mime, name: cMang.name });

      const payload = {
        key: SHARED_KEY,
        chuoi_wq: machine,        // dong may-doc dung dinh dang WQ|...
        caption_hien: human,      // dong nguoi-doc cho nhom Telegram
        nguoi_gui: by,
        photos: photos
      };
      // Content-Type text/plain de tranh CORS preflight (Apps Script khong tra loi OPTIONS)
      const resp = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const text = await resp.text();
      let data = {};
      try { data = JSON.parse(text); } catch (err) { data = { ok: false, error: text }; }
      if (data.ok) {
        show('✅ Đã gửi thành công.' + (warnMsg ? '\n' + warnMsg : ''), 'ok');
        if (bySelect.value === '__other__') {
          localStorage.setItem('wq_by_other_last', by);
        } else if (bySelect.value) {
          localStorage.setItem('wq_by_' + code, bySelect.value);
        }
        thoInp.value = ''; mangInp.value = '';
        photoThoInp.value = ''; photoMangInp.value = '';
        langInputs.forEach(it => { it.numEl.value = ''; it.photoEl.value = ''; });
        historyBox.style.display = 'none'; historySummary.textContent = '';
      } else {
        show('❌ Gửi lỗi: ' + (data.error || JSON.stringify(data)), 'err');
      }
    } catch (e) {
      show('❌ Không gửi được (mạng/Apps Script): ' + e.message +
           '\nThử lại hoặc báo kỹ thuật viên.', 'err');
    } finally {
      btn.disabled = false;
    }
  });
  // ---- màn hình lịch sử 7 ngày (BƯỚC 3) — chỉ xem, không sửa/xoá ----
  historyBtn.addEventListener('click', async () => {
    clearStatus();
    const code = plantSel.value;
    if (!code) { show('❌ Vui lòng chọn nhà máy trước.', 'err'); return; }
    if (!APPS_SCRIPT_URL || !SHARED_KEY) { show('❌ Trang chưa cấu hình.', 'err'); return; }
    historyBtn.disabled = true;
    try {
      const url = APPS_SCRIPT_URL + '?action=history&plant=' + encodeURIComponent(code) +
                  '&days=7&key=' + encodeURIComponent(SHARED_KEY);
      const resp = await fetch(url);
      const data = await resp.json();
      if (!data.ok) { show('❌ Lỗi lịch sử: ' + (data.error || 'Không rõ'), 'err'); return; }
      renderHistory(code, data.rows || []);
    } catch (e) {
      show('❌ Không tải được lịch sử: ' + e.message, 'err');
    } finally {
      historyBtn.disabled = false;
    }
  });

  function fmtLangGon(langs) {
    if (!langs || !langs.length) return '—';
    let top = null;
    for (const l of langs) {
      if (top === null || l.val > top.val) top = l;
    }
    return top === null ? '—' : `${fmtNum(top.val)} (bể ${top.be})`;
  }

  function renderHistory(code, rows) {
    const n = new Date();
    const p = x => String(x).padStart(2, '0');
    const todayStr = `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())}`;
    const todayCount = rows.filter(r => r.date === todayStr).length;
    historySummary.textContent = `Hôm nay đã đo ${todayCount} / 3 lần (${PLANT_NAMES[code] || code}).`;
    if (!rows.length) {
      historyBox.style.display = 'block';
      historyBox.innerHTML = '<div class="hint">Chưa có lần đo nào trong 7 ngày gần đây.</div>';
      return;
    }
    const rowsSorted = rows.slice().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    let html = '<table class="history"><thead><tr><th>Ngày</th><th>Giờ</th><th>Thô</th><th>Sau lắng</th><th>Ra mạng</th><th>Người đo</th></tr></thead><tbody>';
    for (const r of rowsSorted) {
      html += `<tr><td>${r.date.split('-').reverse().join('.')}</td><td>${r.time || ''}</td>` +
              `<td>${r.tho === null || r.tho === undefined ? '—' : fmtNum(r.tho)}</td>` +
              `<td>${fmtLangGon(r.langs || [])}</td>` +
              `<td>${r.mang === null || r.mang === undefined ? '—' : fmtNum(r.mang)}</td>` +
              `<td>${r.by || ''}</td></tr>`;
    }
    html += '</tbody></table>';
    historyBox.style.display = 'block';
    historyBox.innerHTML = html;
  }
</script>
</body>
</html>
